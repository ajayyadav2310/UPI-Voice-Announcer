name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q UPI-Voice-Announcer-Cloud-Build.zip -d project

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/build.gradle")
          s = p.read_text()
          s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """, 1)
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UPI-Voice-Announcer-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
